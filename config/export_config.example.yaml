ssh_host: 192.168.1.1
ssh_user: root
ssh_port: 22
ssh_password: "REPLACE_WITH_SECURE_PASSWORD"
timeout: 10.0
measurement: modem_cells

sources:
  # Remove any sources you don't need, all enabled by default
  - QENG_SERVINGCELL
  - QCAINFO
  - QGDNRCNT

static_tags:
  host: 192.168.1.1
  model: Quectel

allowed_fields:
  # All included in this example - remove any fields you don't want to export 
  - rat
  - mcc
  - mnc
  - carrier_idx
  - pci
  - rsrp
  - rsrq
  - sinr
  - nr_sinr
  - rssi
  - arfcn
  - band
  - dl_bandwidth
  - ul_bandwidth
  - cell_id
  - duplex
  - tac
  - cqi
  - tx_power
  - scs
  - type
  - ulca
  - ul_arfcn
  - state
  - tx_bytes
  - rx_bytes

derived_tags:
  # You can add any fields you want to use as tags here. The key is the tag name, and the value is the field name to derive it from.
  carrier_idx: carrier_idx
  type: type
  pci: pci
  arfcn: arfcn
  mnc: mnc

# Notes:
# - Copy this file to `config/export_config.yaml` and update sensitive values.
# - Do NOT commit `config/export_config.yaml` to git. It's ignored by the repository.
